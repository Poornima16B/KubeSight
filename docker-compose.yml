services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: kubesight-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kubesight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 45s
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kubesight-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kubesight-backend:latest
    container_name: kubesight-backend
    ports:
      - "8000:8000"
    environment:
      # Database & Auth (Production mode)
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/kubesight
      - USE_DATABASE_AUTH=true
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      # Security
      - SECRET_KEY=${SECRET_KEY:-kubesight-local-dev-secret-key-that-is-long-enough-for-validation-checks-2024}
      - DEBUG=true
      # Kubernetes
      - K8S_IN_CLUSTER=false
      - K8S_CONFIG_PATH=/home/kubesight/.kube/config
      - K8S_HOST_OVERRIDE=host.docker.internal
      # AI Provider
      - AI_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=openai/gpt-oss-20b
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # OAuth
      - OAUTH_ENABLED=${OAUTH_ENABLED:-false}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    volumes:
      - ./backend/entrypoint.sh:/app/entrypoint.sh
      - ./backend/app:/app/app
      - ~/.kube:/home/kubesight/.kube:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: kubesight-frontend:latest
    container_name: kubesight-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: kubesight-network
